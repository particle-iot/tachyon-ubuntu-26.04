name: Build Ubuntu 26.04

# Sole CI for this repo (ported from tachyon-ubuntu-24.04's GHA pipeline; no
# CircleCI here). Builds + uploads images on every push/PR; cuts a GitHub
# release on main/tags when the repo variable GHA_CREATE_RELEASE == 'true'.
#
# The build itself runs inside a privileged ubuntu:26.04 container (see
# ci-scripts/build.sh) so the runner's own distro does not need to be 26.04.

on:
  push:
    branches: [main]
    tags: ['**']
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-tachyon
    timeout-minutes: 120
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      # Publishing gate (bring-up default: OFF). While 'false', CI only proves
      # the build: no S3 uploads, no metadata, no publish job. Set the repo
      # variable UPLOAD_ASSETS='true' to enable uploads; GHA_CREATE_RELEASE
      # separately gates GitHub release creation.
      UPLOAD_ASSETS: ${{ vars.UPLOAD_ASSETS || 'false' }}
    strategy:
      fail-fast: false
      matrix:
        variant: [headless, desktop]
    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
      base_path: ${{ steps.meta.outputs.base_path }}
      is_release: ${{ steps.meta.outputs.is_release }}
    steps:
      - name: Free up disk space
        run: |
          df -h || true
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache || true
          df -h || true

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need full history for `git rev-list --count`

      - name: Determine release metadata
        id: meta
        env:
          GH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "$GH_REF" == "refs/heads/main" || "$GH_REF" == refs/tags/* ]]; then
            RELEASE_TAG="image-$(git rev-list --count HEAD)-$(git rev-parse --short HEAD)"
            BASE_PATH="release"
            IS_RELEASE="true"
          else
            RELEASE_TAG="pre-$(git rev-parse --short HEAD)"
            BASE_PATH="prerelease"
            IS_RELEASE="false"
          fi
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "base_path=${BASE_PATH}"     >> "$GITHUB_OUTPUT"
          echo "is_release=${IS_RELEASE}"   >> "$GITHUB_OUTPUT"
          echo "Resolved: tag=${RELEASE_TAG} base=${BASE_PATH} release=${IS_RELEASE}"

      # Preflight the AWS OIDC inputs so a missing or malformed secret fails
      # here with an actionable message instead of surfacing later as an opaque
      # assume-role error from configure-aws-credentials.
      #
      # Values are never logged -- only the name of the offending secret and
      # what is wrong with it. An unsalted hash of an ARN or a region code is
      # brute-forceable offline (tiny search space), so digests are not logged
      # either; inspect the secret in repository settings to see its value.
      #
      # Gated on UPLOAD_ASSETS because these secrets are only required when
      # uploads are enabled; with uploads off they are legitimately unset.
      - name: Validate AWS credential inputs
        if: env.UPLOAD_ASSETS == 'true'
        env:
          ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          AWS_REGION_SECRET: ${{ secrets.AWS_REGION }}
        run: |
          set -uo pipefail

          # Known AWS region codes across the aws, aws-us-gov and aws-cn
          # partitions. If AWS adds a region and CI starts rejecting a valid
          # one, add it here.
          KNOWN_REGIONS=(
            us-east-1 us-east-2 us-west-1 us-west-2
            af-south-1
            ap-east-1 ap-east-2
            ap-south-1 ap-south-2
            ap-northeast-1 ap-northeast-2 ap-northeast-3
            ap-southeast-1 ap-southeast-2 ap-southeast-3 ap-southeast-4
            ap-southeast-5 ap-southeast-6 ap-southeast-7
            ca-central-1 ca-west-1
            eu-central-1 eu-central-2
            eu-west-1 eu-west-2 eu-west-3
            eu-north-1
            eu-south-1 eu-south-2
            il-central-1
            me-central-1 me-south-1
            mx-central-1
            sa-east-1
            us-gov-east-1 us-gov-west-1
            cn-north-1 cn-northwest-1
          )

          # IAM role ARN: partition, 12-digit account id, then an optional
          # /path/ followed by the role name. Deliberately rejects non-role
          # ARNs such as arn:aws:sts::<acct>:assumed-role/... and the OIDC
          # provider ARN, which are common mix-ups here.
          ARN_RE='^arn:(aws|aws-cn|aws-us-gov):iam::[0-9]{12}:role/([A-Za-z0-9+=,.@_-]+/)*[A-Za-z0-9+=,.@_-]+$'

          errs=0
          fail() { printf '::error::%s\n' "$1"; errs=$((errs + 1)); }

          # Shared checks: present and free of surrounding whitespace. Returns
          # non-zero when the value is unusable, so callers skip format checks.
          check_present() {  # $1=label  $2=value
            local label="$1" value="$2" trimmed
            if [[ -z "$value" ]]; then
              fail "Secret ${label} is empty or not set, but UPLOAD_ASSETS is 'true' so it is required. Add it to the 'production' environment for this repository (environment-scoped secrets are not inherited from repo-level secrets)."
              return 1
            fi
            trimmed="${value#"${value%%[![:space:]]*}"}"
            trimmed="${trimmed%"${trimmed##*[![:space:]]}"}"
            if [[ "$trimmed" != "$value" ]]; then
              fail "Secret ${label} has leading or trailing whitespace. Re-save it without surrounding spaces or a trailing newline -- the raw value is passed through to AWS, so it cannot be trimmed here."
              return 1
            fi
            return 0
          }

          if check_present AWS_ROLE_ARN "${ROLE_ARN:-}"; then
            if [[ ! "$ROLE_ARN" =~ $ARN_RE ]]; then
              fail "Secret AWS_ROLE_ARN is not a valid IAM role ARN. Expected arn:aws:iam::<12-digit-account-id>:role/<role-name>, where an optional /path/ before the role name is allowed. It must be the IAM role ARN itself -- not an STS assumed-role ARN, not a user ARN, and not the OIDC identity provider ARN."
            fi
          fi

          if check_present AWS_REGION "${AWS_REGION_SECRET:-}"; then
            region_known=false
            for r in "${KNOWN_REGIONS[@]}"; do
              if [[ "$AWS_REGION_SECRET" == "$r" ]]; then
                region_known=true
                break
              fi
            done
            if [[ "$region_known" != true ]]; then
              fail "Secret AWS_REGION is not a known AWS region code. Expected a lowercase code such as us-west-2. If AWS has added a region since this step was written, add it to KNOWN_REGIONS in .github/workflows/build.yml."
            fi
          fi

          if (( errs > 0 )); then
            printf '::error::AWS credential validation failed with %d problem(s); see the annotations above. Secret values are intentionally not logged -- inspect them in repository settings.\n' "$errs"
            exit 1
          fi

          echo "AWS_ROLE_ARN and AWS_REGION passed validation."

      - name: Configure AWS credentials
        if: env.UPLOAD_ASSETS == 'true'
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: tachyon-2604-${{ matrix.variant }}-${{ github.run_id }}

      - name: Build rootfs
        run: |
          set -euo pipefail
          bash ci-scripts/build.sh "${{ matrix.variant }}"

      - name: Upload image to S3 and write metadata
        if: env.UPLOAD_ASSETS == 'true'
        env:
          S3_BUCKET: ${{ secrets.LINUX_DIST_S3_BUCKET }}
          CLOUDFRONT_URL: https://linux-dist.particle.io
          RELEASE_TAG: ${{ steps.meta.outputs.release_tag }}
          BASE_PATH: ${{ steps.meta.outputs.base_path }}
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          RELEASE_NAME="tachyon-ubuntu-26.04-${VARIANT}-${RELEASE_TAG}.img.xz"
          ARTIFACT_PATH="${BASE_PATH}/${RELEASE_NAME}"

          aws s3 cp build/rootfs.img.xz "s3://${S3_BUCKET}/${ARTIFACT_PATH}" --only-show-errors
          ARTIFACT_URL="${CLOUDFRONT_URL}/${ARTIFACT_PATH}"
          echo "Uploaded ${ARTIFACT_URL}"

          mkdir -p release-metadata
          jq -n \
            --arg release_name "$RELEASE_NAME" \
            --arg version "$RELEASE_TAG" \
            --arg variant "$VARIANT" \
            --arg url "$ARTIFACT_URL" \
            '{release_name: $release_name, version: $version, variant: $variant, distribution: "ubuntu", distribution_version: "26.04", artifacts: [{artifact_url: $url}]}' \
            > "release-metadata/${VARIANT}_metadata.json"

      - name: Upload metadata artifact
        if: env.UPLOAD_ASSETS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-metadata-${{ matrix.variant }}
          path: release-metadata/*.json
          retention-days: 5

  publish:
    needs: build
    # Skipped entirely while the UPLOAD_ASSETS repo var is not 'true' (no
    # metadata artifacts exist to assemble in that case).
    if: needs.build.result == 'success' && vars.UPLOAD_ASSETS == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write       # create GitHub releases
      pull-requests: write  # comment on PRs
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download metadata artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-metadata-*
          path: release-metadata
          merge-multiple: true

      - name: Assemble artifact metadata
        id: assemble
        env:
          SCHEMA_URL: https://tachyon-ci.particle.io/schema/artifact_metadata_v1.json
        run: |
          set -euo pipefail
          jq --arg schema_url "$SCHEMA_URL" -s \
            '{"$schema": $schema_url, "builds": .}' \
            release-metadata/*_metadata.json > release-metadata/artifact_metadata.json

          RELEASE_NOTES="$(jq -r '.builds[] | "[Download \(.variant) rootfs image from CDN](\(.artifacts[0].artifact_url))"' release-metadata/artifact_metadata.json)"
          {
            echo 'notes<<EOF'
            echo "$RELEASE_NOTES"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          jq -C . release-metadata/artifact_metadata.json

      - name: Create GitHub release
        if: needs.build.outputs.is_release == 'true' && vars.GHA_CREATE_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
          RELEASE_NOTES: ${{ steps.assemble.outputs.notes }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            --target "${{ github.sha }}" \
            --generate-notes \
            --notes "$RELEASE_NOTES"
          gh release upload "$RELEASE_TAG" release-metadata/artifact_metadata.json

      - name: Comment on PR with download links
        if: github.event_name == 'pull_request'
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            **Built `${{ github.sha }}`** (GitHub Actions)

            ${{ steps.assemble.outputs.notes }}
